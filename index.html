<!DOCTYPE html>
<html lang="ko">

 <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>중국 지리·음식 탐험</title>

    <link rel="stylesheet" href="style.css">

</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Yeon+Sung&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>중국 지리 탐험</title>

<style>

body{

    margin:0;

    font-family :sans-serif;

    background:#f5f5f5;
}

.region-icon{

    cursor:pointer;

    transition:
        transform 0.25s ease,
        filter 0.25s ease;

    transform-box:fill-box;
    transform-origin:center;
}

.region-icon:hover{

    transform:scale(1.15);

    filter:
        drop-shadow(0 0 5px rgb(255, 255, 255))
        drop-shadow(0 0 10px rgb(255, 255, 255));
}

.hidden{
    display: none;
}

.map-container{

    position:relative;

    width:100vw;

    height:100vh;

    overflow:hidden;
}

.map-image{

    width:100%;

    height:100%;

    object-fit:cover;
}

.region-btn{

    position:absolute;

    background:none;

    border:none;

    padding:0;

    cursor:pointer;
}

.icon-img{

    width:250px;

    transition:0.3s;
}

.icon-img:hover{

    transform:scale(1.1);
    filter: drop-shadow(0 0 12px white);
}

.overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    display:none;

    z-index:999;
}

.popup{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    width:min(75vw, 900px);

    max-width:50vh;

    max-height:85vh;

    overflow: auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:0 0 25px rgba(0,0,0,0.3);

    display:none;

    z-index:1000;
    
}

.close-btn{

    margin-top:20px;

    padding:10px 18px;

    border:none;

    border-radius:10px;

    background:black;

    color:white;

    cursor:pointer;

    font-size:16px;
}

.info-section{

    display:flex;

    gap:25px;

    align-items:center;

    margin-top:20px;
}


.info-text{

    flex:1;

    line-height:1.8;

    font-size:18px;
}

.carousel{

    position:relative;

    object-fit:relative;

    width:100%;

    height:300px;

    overflow:hidden;

    border-radius:15px;

    margin-bottom:20px;
}

.carousel img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.carousel-btn{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:45px;

    height:45px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,0.5);

    color:white;

    cursor:pointer;
}

.left{

    left:10px;
}

.right{

    right:10px;
}

.page-btn{

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    font-size:22px;
}

.info-section{

    display:flex;

    gap:20px;

    align-items:flex-start;
}

.basic-info{

    text-align: left;
    flex:1;
    font-size: 25px;
    font-weight: bold;
    color: #4b241fb9;
    line-height:1.6;
}

body{
    margin:0;
    background:#4b241fb9;
    font-family:'Gowun Dodum', cursive;
}

.popup-title{

    margin-top: 0;

    text-align:center;

    font-size:70px;

    margin-bottom:20px;

    color: #4b241fd3;
}

.popup-text{
    flex:1;
    font-size: 25px;
    font-weight: bold;
    color: #4b241fb9;
    line-height:1.8;
}

.map-image{
    animation: zoomInMap 1.5s ease-out forwards;
}

@keyframes zoomInMap{
    from{
        transform:scale(1) translateX(0) translateY(0);
    }
    to{
        transform:scale(1.8) translateX(-120px) translateY(-100px);
    }
}

.start-fade{
    opacity:0;
    animation:fadeIn 1s ease forwards;
    animation-delay:2s;
}

@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

.fade-in{
    animation:fadeIn 0.5s ease forwards;
}

.china-map{
    width:100%;
    height:auto;
    display:block;
}

#popupMap{
    width:40%;
    aspect-ratio: 1/1;
}

@media (max-width:768px){

    .popup{

        width:70vw;

        transform:translate(-50%, -50%) scale(0.5);

        transform-origin:center center;
    }

}

.result-image{

    width:100%;

    max-height:90vh;

    object-fit:contain;

    border-radius:15px;
}

</style>

</head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<div class="popup" id="regionPopup">

    <div id="page1">

        <h2 id="popupTitle" class="popup-title"></h2>

        <h2 id="popupTitle"></h2>

        <!-- 캐러셀 -->

        <div class="carousel">

            <img
            id="carouselImage"
            src="">

            <button
            class="carousel-btn left"
            onclick="prevImage()">

            ◀

            </button>

            <button
            class="carousel-btn right"
            onclick="nextImage()">

            ▶

            </button>

        </div>

        <!-- 지도 + 설명 -->

        <div class="info-section">

            <iframe id="popupMap"></iframe>

            <div class="basic-info">

                <p id="popupLocation"></p>

                <p id="popupClimate"></p>

                <p id="popupTerrain"></p>

            </div>

        </div>

        <div style="text-align:right;">

            <button
            class="page-btn"
            onclick="nextPage()">

            ▶

            </button>

        </div>

    </div>

    <!-- 2페이지 -->

        <h2 id="popupTitle" class="popup-title"></h2>

        <h2 id="popupTitle2" class="popup-title"></h2>

        <div id="popupText2" class="popup-text"></div>

        <div
        style="

        ">

</div>

    닫기

    </button>

</div>

<script>

const regions = {

    sichuan:{

        title:"쓰촨",

        x:730,
        y:530,

        icon:"images/sichuan.png",

        location:"중국 서남부",

        climate:"고온다습",

        terrain:"쓰촨 분지",

        text1:"쓰촨은 중국 서남부에 위치하며 분지 지형이 발달하였다.",

        text2:"사천요리는 중국 서부의 산악지대와 양쯔강 상류 지역에서 발달하였다. 사천 분지는 여름철 고온다습한 기후가 나타나 식재료가 쉽게 상할 수 있었고, 이를 보존하기 위해 고추와 후추, 생강 등의 향신료를 적극적으로 사용하게 되었다. 또한 산악지형 덕분에 다양한 야생동물과 채소, 버섯, 죽순 등을 얻을 수 있었고, 풍부한 강 수산물도 활용할 수 있었다. 이러한 환경은 식재료의 다양성과 복합적인 맛을 발전시키는 기반이 되었다. 사천요리는 볶음과 찜을 중심으로 조리하며, 고추와 화자오(사천후추)를 사용해 얼얼하고 매운 ‘마라(麻辣)’ 풍미를 만들어낸다. 산악지대 특성상 절임과 건조 저장식품도 발달하였으며, 마파두부와 훠궈 같은 대표 음식이 이러한 지역적 특징을 잘 보여준다.",

        map:"https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d14147399.942594174!2d103.169517!3d30.038146999999995!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x36e4e73368bdcdb3%3A0xde8f7ccf8f99feb9!2z7KSR6rWtIOyTsOy0qCDshLE!5e0!3m2!1sko!2skr!4v1780304430462!5m2!1sko!2skr",

        images:[

            "images/sichuan1.jpg",
            "images/sichuan2.jpg",
            "images/sichuan3.jpg",
            "images/sichuan4.jpg",
            "images/sichuan5.jpg"
        ],
        
        next:"guangdongBtn"
    },

    guangdong:{

        title:"광둥",

        location:"중국 남부, 남중국해 연안",

        climate:"아열대 몬순기후로 인해 고온다습",

        terrain:"해안 평야와 구릉, 하천 삼각주",

        text2:"광둥요리는 중국 남부의 아열대 기후 지역에서 발달하였다. 이 지역은 강수량이 풍부하고 연중 기온이 높아 사계절 내내 채소와 과일을 생산할 수 있으며, 바다와 인접해 각종 해산물도 쉽게 구할 수 있다. 이러한 자연환경 덕분에 다양한 식재료를 활용하는 음식 문화가 형성되었고, 재료 본연의 신선함과 단맛을 살리는 조리법이 발전하였다. 또한 16세기 이후 광저우를 중심으로 스페인·포르투갈 등 서양 상인과 선교사들의 왕래가 활발해지면서 서양 요리 기법과 식문화가 유입되었다. 그 결과 광둥요리는 맛뿐 아니라 색채와 장식을 중요하게 여기는 화려한 외관을 갖추게 되었으며, 담백하면서도 풍성한 맛이 특징으로 자리 잡았다. 오늘날 세계 각지의 중국요리 역시 광둥요리의 영향을 크게 받고 있다.",

        map:"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3767084.8979239212!2d110.85091415147825!3d22.773030695509696!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x315285f132af5c3f%3A0x2ed41c6f09259f29!2z7KSR6rWtIOq0keuRpSDshLE!5e0!3m2!1sko!2skr!4v1780301722794!5m2!1sko!2skr",
        
        images:[
            "images/guangdong1.jpg",
            "images/guangdong2.jpg",
            "images/guangdong3.jpg"
        ],

        next:"shandongBtn"
    },

    shandong:{

        title:"산둥",

        location:"중국 동부, 황해 및 발해 연안",

        climate:"사계절이 뚜렷한 온대 몬순기후",

        terrain:"반도 지형과 평야, 낮은 산지",

        text1:"example",

        text2:"산둥요리는 황허 하류와 교동반도 해안 지역에서 발전하였다. 이 지역은 보하이해와 황해에 접해 있어 해삼, 전복, 새우 등 다양한 해산물이 풍부하며, 넓은 평야에서는 밀, 옥수수, 수수 등의 곡물이 많이 생산된다. 따라서 북부 농경문화와 해안 식문화가 결합된 독특한 음식 체계를 형성하였다. 건조한 기후의 영향으로 양파, 파, 생강, 마늘 등을 적극 활용해 맛을 진하게 내는 것이 특징이며, 재료 본연의 맛을 살리는 조리법을 중요하게 여긴다. 특히 해산물 요리에서는 신선함을 강조하며 맑고 깊은 국물 요리가 발달하였다. 산둥요리는 중국 궁중요리와 북방요리의 기초가 되었고, 한국의 중화요리 형성에도 큰 영향을 미친 대표적인 북방 요리로 평가된다.",

        map:"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3282680.5343073294!2d116.13229066824283!3d36.536201170239124!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x358fcd4735ab4f7f%3A0xd93a2e2370e1b364!2z7KSR6rWtIOyCsOuRpSDshLE!5e0!3m2!1sko!2skr!4v1780301851469!5m2!1sko!2skr",

        
        images:[
            "images/shandong1.jpg",
            "images/shandong2.jpg",
            "images/shandong3.jpg"
        ],

        next:"jiangsuBtn"
    },

    jiangsu:{

        title:"장쑤",
        
        location:"중국 동부, 양쯔강 하류",

        climate:"온난습윤한 몬순기후",

        terrain:"넓은 평야와 호수, 수로 발달",

        text2:"장쑤요리, 특히 회양요리는 화이허와 양쯔강 하류 지역의 비옥한 평야와 수향(水鄕) 환경 속에서 발전하였다. 강과 호수, 운하가 촘촘히 연결되어 있어 민물고기와 새우, 게 등 수산물이 풍부하고 농업 생산성도 높았다. 이러한 환경은 신선한 재료를 중심으로 섬세하고 정교한 요리 문화를 형성하는 배경이 되었다. 회양요리는 칼질 기술을 매우 중요하게 여기며, 찜과 탕 요리를 통해 재료 본연의 맛을 살리는 데 집중한다. 또한 죽순, 버섯, 배, 찻잎 등 지역 특산물을 해산물과 조화롭게 사용한다. 자극적인 향신료 대신 소금과 설탕을 활용해 부드럽고 은은한 단맛을 내며, 우아하고 세련된 맛 때문에 중국 궁중요리 발전에도 큰 영향을 미쳤다.",

        map:"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3429656.825767709!2d116.53825454224747!3d32.91735185443828!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x35b700da314bc245%3A0x8d94eab66c8553b5!2z7KSR6rWtIOyepeyRpCDshLE!5e0!3m2!1sko!2skr!4v1780316647747!5m2!1sko!2skr",

        
        images:[
            "images/jiangsu1.jpg",
            "images/jiangsu2.jpg",
            "images/jiangsu3.jpg"
        ],

        next:"anhuiBtn"
    },

    anhui:{

        title:"안후이",

        location:"중국 동부 내륙",

        climate:"북부 온대, 남부 아열대 기후",

let currentRegion = "";

let currentImage = 0;

function openRegion(region){

    currentRegion = region;

    const data = regions[region];

    currentImage = 0;

    document.getElementById("carouselImage")
    .src = data.images[0];

    document.getElementById("popupTitle")
    .innerText = data.title;

    document.getElementById("popupTitle2")
    .innerText = data.title;

    document.getElementById("popupLocation")
    .innerText = "위치: " + data.location;

    document.getElementById("popupClimate")
    .innerText = "기후: " + data.climate;

    document.getElementById("popupTerrain")
    .innerText = "지형: " + data.terrain;

    document.getElementById("popupText2")
    .innerText = data.text2;

    document.getElementById("popupMap")
    .src = data.map;

    document.getElementById("overlay")
    .style.display = "block";

    document.getElementById("regionPopup")
    .style.display = "block";
}

function closeRegion(){

    document.getElementById("overlay")
    .style.display = "none";

    document.getElementById("regionPopup")
    .style.display = "none";

    const nextBtn =
    regions[currentRegion].next;

    console.log("currentRegion =", currentRegion);
    console.log("nextBtn =", nextBtn);
    console.log("button =", document.getElementById(nextBtn));

    if(nextBtn){

        document
        .getElementById(nextBtn)
        .classList.remove("hidden");

        document.getElementById(nextBtn)
        .classList.add("fade-in");
    }

    document.getElementById("page2")
    .classList.add("hidden");

    document.getElementById("page1")
    .classList.remove("hidden");
}

function nextImage(){

    const data =
    regions[currentRegion];

    currentImage++;

    if(currentImage >= data.images.length){

        currentImage = 0;
    }

    document.getElementById("carouselImage")
    .src = data.images[currentImage];
}

function prevImage(){

    const data =
    regions[currentRegion];

    currentImage--;

    if(currentImage < 0){

        currentImage =
        data.images.length - 1;
    }

    document.getElementById("carouselImage")
    .src = data.images[currentImage];
}

function nextPage(){

    document.getElementById("page1")
    .classList.add("hidden");

    document.getElementById("page2")
    .classList.remove("hidden");
}

function prevPage(){

    document.getElementById("page2")
    .classList.add("hidden");

    document.getElementById("page1")
    .classList.remove("hidden");
}

function openResult(){

    document.getElementById("overlay")
    .style.display = "block";

    document.getElementById("resultPopup")
    .style.display = "block";
}

function closeResult(){

    document.getElementById("overlay")
    .style.display = "none";

    document.getElementById("resultPopup")
    .style.display = "none";
}
